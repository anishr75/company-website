<title>Thank You</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f3f4f6;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.container{
background:white;
padding:50px 40px;
border-radius:20px;
text-align:center;
box-shadow:0 4px 20px rgba(0,0,0,0.08);
max-width:520px;
width:100%;
animation:fadeIn .6s ease;
}

.icon{
font-size:60px;
margin-bottom:20px;
animation:heartbeat 1.5s infinite;
}

h1{
font-size:42px;
color:#111827;
margin-bottom:15px;
}

p{
font-size:18px;
color:#4b5563;
line-height:1.7;
margin-bottom:10px;
}

.brand{
font-weight:bold;
color:#111827;
}

button{
margin-top:25px;
background:#111827;
color:white;
border:none;
padding:15px 32px;
border-radius:10px;
font-size:17px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes heartbeat{
0%{transform:scale(1);}
25%{transform:scale(1.08);}
50%{transform:scale(1);}
75%{transform:scale(1.08);}
100%{transform:scale(1);}
}

</style>
</head>

<div class="icon">💙</div>

<h1>Thank You!</h1>

<p>

</p>

<p>
Thank you for contacting
<span class="brand">
Mastercare Samsung Service Center
</span>.
</p>

<p>
We appreciate your trust and will get back to you shortly ❤️
</p>

Back To Home
</button>

</div>
