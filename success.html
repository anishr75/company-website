<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<title>Order Successful</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.box{
background:white;
padding:50px;
border-radius:20px;
text-align:center;
max-width:520px;
width:100%;
box-shadow:
0 4px 20px rgba(0,0,0,0.08);
animation:fadeIn .6s ease;
}

.icon{
font-size:60px;
margin-bottom:15px;
}

h1{
font-size:42px;
color:#111827;
margin-bottom:18px;
}

p{
font-size:18px;
color:#4b5563;
line-height:1.8;
margin-bottom:12px;
}

.highlight{
font-weight:bold;
color:#111827;
}

a{
display:inline-block;
margin-top:25px;
padding:14px 30px;
background:black;
color:white;
text-decoration:none;
border-radius:8px;
font-size:16px;
transition:.3s;
}

a:hover{
transform:translateY(-2px);
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>

</head>

<body>

<div class="box">

<div class="icon">✅</div>

<h1>Payment Successful</h1>

<p>
Your order has been placed successfully.
</p>

<p>
Thank you for shopping with us ❤️
</p>

<p>
Your parcel will be delivered within
<span class="highlight">
4–5 working days
</span>.
</p>

<p>
We truly appreciate your trust in us.
</p>

<a href="index.html">
Continue Shopping
</a>

</div>

</body>
</html>
