<html>
<head>

<meta charset="UTF-8">
<title>My Orders</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:40px 20px;
}

.container{
max-width:1100px;
margin:auto;
}

/* TOP BAR */
.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
flex-wrap:wrap;
gap:15px;
}

.heading{
font-size:32px;
}

/* CONTINUE SHOPPING BUTTON */
.shop-btn{
background:#e8fff0;
color:green;
border:none;
padding:14px 22px;
border-radius:12px;
font-size:15px;
font-weight:600;
cursor:pointer;
transition:.3s;
font-weight:bold;
}

.shop-btn:hover{
background:#d7f7e3;
transform:translateY(-2px);
}
/* ORDER CARD */
.order-card{
background:white;
border-radius:18px;
padding:25px;
margin-bottom:25px;
box-shadow:0 5px 18px rgba(0,0,0,0.08);
}

.order-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
padding-bottom:20px;
border-bottom:1px solid #eee;
}

.order-id{
font-size:22px;
font-weight:bold;
margin-bottom:8px;
}

.order-date{
color:#666;
font-size:14px;
}

.order-price{
text-align:right;
}

.order-price h2{
margin-bottom:8px;
font-size:34px;
}

.status{
display:inline-block;
background:#e8fff0;
color:green;
padding:8px 14px;
border-radius:50px;
font-size:14px;
font-weight:bold;
}

.payment-id{
margin-top:12px;
font-size:13px;
color:#666;
word-break:break-all;
}

/* PRODUCT */
.product{
display:flex;
align-items:center;
gap:20px;
padding:18px 0;
border-bottom:1px solid #f1f1f1;
}

.product:last-child{
border-bottom:none;
}

.product img{
width:90px;
height:90px;
object-fit:contain;
background:#fafafa;
border-radius:12px;
padding:10px;
}

.product-info{
flex:1;
}

.product-name{
font-size:17px;
font-weight:600;
margin-bottom:8px;
}

.product-meta{
color:#666;
font-size:14px;
}

.product-price{
font-size:18px;
font-weight:bold;
}

/* EMPTY */
.empty{
text-align:center;
padding:80px 20px;
background:white;
border-radius:18px;
font-size:22px;
box-shadow:0 5px 18px rgba(0,0,0,0.08);
}

/* MOBILE */
@media(max-width:768px){

.order-header{
flex-direction:column;
align-items:flex-start;
gap:15px;
}

.order-price{
text-align:left;
}

.product{
align-items:flex-start;
}

.product img{
width:75px;
height:75px;
}

.heading{
font-size:28px;
}

.shop-btn{
width:100%;
}

}

</style>
</head>

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PPWDCWKL"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<div class="container">

<!-- TOP BAR -->
<div class="top-bar">

<h1 class="heading">
📦 My Orders
</h1>

<button class="shop-btn"
onclick="continueShopping()">
🛒 Continue Shopping
</button>

</div>

<div id="orders"></div>

</div>

<script>

function continueShopping(){

window.location.href =
"accessory.html";

}

let email =
localStorage.getItem("userEmail");

fetch("/my-orders/" + email)

.then(res=>res.json())

.then(data=>{

let ordersDiv =
document.getElementById("orders");

if(data.orders.length === 0){

ordersDiv.innerHTML = `
<div class="empty">
No Orders Found
</div>
`;

return;
}

data.orders.forEach(order=>{

let date =
new Date(order.created_at);

let formattedDate =
date.toLocaleString("en-IN",{
timeZone:"Asia/Kolkata",
day:"numeric",
month:"long",
year:"numeric",
hour:"numeric",
minute:"2-digit"
});

let html = `

<div class="order-card">

<div class="order-header">

<div>

<div class="order-id">
Order #${order.id}
</div>

<div class="order-date">
${formattedDate}
</div>

</div>

<div class="order-price">

<h2>
₹${order.total}
</h2>

<div class="status">
✅ ${order.status}
</div>

<div class="payment-id">
Payment ID:
${order.payment_id}
</div>

</div>

</div>
`;

order.items.forEach(item=>{

html += `

<div class="product">

<img src="${item.cover_image}">

<div class="product-info">

<div class="product-name">
${item.name}
</div>

<div class="product-meta">
Qty: ${item.quantity}
</div>

</div>

<div class="product-price">
₹${item.price}
</div>

</div>
`;

});

html += `</div>`;

ordersDiv.innerHTML += html;

});

});

</script>

</body>
</html>
